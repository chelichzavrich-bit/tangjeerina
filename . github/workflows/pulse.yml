# Бесплатный "будильник": раз в ~20 минут стучится в /api/pulse.
# Бот сам решает, пора ли писать (у каждого чата своя случайная пауза), поэтому частые вызовы безопасны.
# Нужны секреты репозитория: PULSE_URL (https://<проект>.vercel.app/api/pulse) и CRON_SECRET.
name: pulse
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/pulse
        run: |
          curl -sS -m 60 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.PULSE_URL }}" || echo "ping failed"
