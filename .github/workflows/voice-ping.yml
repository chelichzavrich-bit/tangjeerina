name: Pulse Trigger

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      voice_force:
        description: 'Отправить голосовое прямо сейчас (1/0)'
        required: false
        default: '0'
      chat_id:
        description: 'ID чата для теста (необязательно)'
        required: false
        default: ''

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call pulse endpoint
        env:
          PULSE_URL: ${{ secrets.PULSE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VF: ${{ github.event.inputs.voice_force }}
          CHAT: ${{ github.event.inputs.chat_id }}
        run: |
          set -euo pipefail
          Q=""
          if [ "${VF:-0}" = "1" ]; then Q="${Q}&voice_force=1"; fi
          if [ -n "${CHAT:-}" ]; then Q="${Q}&chat_id=${CHAT}"; fi
          curl -sS --max-time 90 -H "Authorization: Bearer ${CRON_SECRET}" "${PULSE_URL}?daily=1${Q}"
